# PERSONA analysis pipeline configuration.
# Raw data under annotations_csv / persona_mh_outputs / humt_results is never modified.

paths:
  repo_root: "."
  data_csv: "annotations_csv/all_models_persona_annotations.csv"
  figures_dir: "figures"
  tables_dir: "tables"
  results_dir: "results"
  reports_dir: "reports"

reproducibility:
  random_seed: 42
  n_bootstrap: 500
  n_cv_folds: 5
  n_permutation: 50

columns:
  id: "prompt_id"
  model: "model"
  dataset: "source_set"
  category: "topic"
  failure_mode: "failure_mode"
  response: "response"
  humt: "humt_score"
  empathy: "Empathy_score"
  deception: "DeceptionRisk_score"
  fit: "ContextualFit_score"
  oa: "OverallAppropriateness_score"

# Canonical short names used throughout analysis outputs.
metrics:
  HuMT: "humt_score"
  E: "Empathy_score"
  D: "DeceptionRisk_score"
  F: "ContextualFit_score"
  OA: "OverallAppropriateness_score"

parts:
  data_quality: true
  reliability: true
  model_comparison: true
  correlation: true
  regression: true
  incremental_validity: true
  feature_importance: true
  calibration: true
  sensitivity: true
  ablation: true
  adversarial: true
  clustering: true
  latent_structure: true
  hypothesis_testing: true
  figures: true
  tables: true
  report: true

logging:
  level: "INFO"

plotting:
  dpi: 300
  figsize: [8, 5]
  font_size: 11
